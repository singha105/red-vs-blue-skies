# Build with Vite and deploy to GitHub Pages on every push to main.
# Based on the official Vite "Deploying a Static Site" guide (GitHub Pages section).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Metered TURN for phones on mobile data (repo secrets; the build falls back to STUN without them).
          VITE_TURN_DOMAIN: ${{ secrets.VITE_TURN_DOMAIN }}
          VITE_TURN_API_KEY: ${{ secrets.VITE_TURN_API_KEY }}
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
